name: Sync Brain Food Playlist

on:
  workflow_dispatch:

  schedule:
    # 18:00 UTC = 2 PM EDT (summer), 19:00 UTC = 2 PM EST (winter).
    - cron: "0 18 * * *"
    - cron: "0 19 * * *"

jobs:
  sync:
    permissions:
      contents: write
    uses: ./.github/workflows/_playlist-sync.yml
    with:
      label: Brain Food
      script: archive-playlists.py
      archive_playlist_id: "37i9dQZF1DWXLeA8Omikj7"
      destination_playlist_id: "5Hcbss2XBcioA7GEGM0yOf"
      log_path: logs/brain-food-output.txt
    secrets: inherit
