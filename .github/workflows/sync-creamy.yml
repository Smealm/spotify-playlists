name: Archive Creamy Playlist

on:
  workflow_dispatch:

jobs:
  archive-creamy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Mirror Creamy archive
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          python sync_creamy.py \
            --archive-url "https://raw.githubusercontent.com/mackorone/spotify-playlist-archive-2/refs/heads/main/playlists/cumulative/37i9dQZF1DXdgz8ZB7c2CP.md" \
            --destination-playlist-id "0d9fkV0DPxsq5Ag7IP8obL"