name: Sync Creamy Playlist

on:
  workflow_dispatch:

  schedule:
    # GitHub cron is UTC and cannot follow daylight saving, so both 2 PM
    # offsets are scheduled and the shared workflow keeps the matching one.
    # 18:00 UTC = 2 PM EDT (summer), 19:00 UTC = 2 PM EST (winter).
    - cron: "0 18 * * *"
    - cron: "0 19 * * *"

jobs:
  sync:
    permissions:
      contents: write
    uses: ./.github/workflows/_playlist-sync.yml
    with:
      label: Creamy
      script: archive-playlists.py
      archive_playlist_id: "37i9dQZF1DXdgz8ZB7c2CP"
      destination_playlist_id: "0d9fkV0DPxsq5Ag7IP8obL"
      log_path: logs/creamy-output.txt
    secrets: inherit
