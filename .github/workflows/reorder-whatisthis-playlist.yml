name: Reorder What Is This Playlist

on:
  workflow_dispatch:

  schedule:
    # 16:00 UTC every day
    - cron: "0 16 * * *"

jobs:
  reorder-what-is-this:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Reorder What Is This playlist
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          python reorder-playlists.py \
            --destination-playlist-id "5sahCBpr8p5Bzte0QgB4gh" \
            --log "logs/what-is-this-output.txt"

      - name: Commit updated log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "logs/what-is-this-output.txt"

          if git diff --cached --quiet; then
            echo "No log changes to commit."
          else
            git commit -m "Update What Is This reorder log"
            git push
          fi
