name: Reorder What Is This Playlist

on:
  workflow_dispatch:

  schedule:
    # 18:00 UTC = 2 PM EDT (summer), 19:00 UTC = 2 PM EST (winter).
    - cron: "0 18 * * *"
    - cron: "0 19 * * *"

jobs:
  sync:
    permissions:
      contents: write
    uses: ./.github/workflows/_playlist-sync.yml
    with:
      label: What Is This
      script: reorder-playlists.py
      destination_playlist_id: "5sahCBpr8p5Bzte0QgB4gh"
      log_path: logs/what-is-this-output.txt
    secrets: inherit
