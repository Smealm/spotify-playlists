name: Sync Dubstep Don Playlist

on:
  workflow_dispatch:

  schedule:
    # 18:00 UTC = 2 PM EDT (summer), 19:00 UTC = 2 PM EST (winter).
    - cron: "0 18 * * *"
    - cron: "0 19 * * *"

jobs:
  sync:
    permissions:
      contents: write
    uses: ./.github/workflows/_playlist-sync.yml
    with:
      label: Dubstep Don
      script: archive-playlists.py
      archive_playlist_id: "37i9dQZF1DX5Q27plkaOQ3"
      destination_playlist_id: "6jFdULRcOzcsNJoHLU136C"
      log_path: logs/dubstep-don-output.txt
    secrets: inherit
